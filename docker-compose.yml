services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-planning-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - stack.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
